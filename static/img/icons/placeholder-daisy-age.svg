<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" data-placeholder="true">
  <title>PLACEHOLDER Daisy Age</title>
  <desc>PLACEHOLDER variant. The vinyl disc is the circle from packaging/menu-icon.png, recolored. The equalizer halo, straight tonearm, and crossfader are drawn on that disc. This is not final brand art.</desc>
  <rect width="256" height="256" rx="56" fill="#1F6B45"/>
  <text x="128" y="22" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#F5C518">PLACEHOLDER</text>
  <g id="equalizer-halo">
    <g transform="rotate(-75 128 122)" fill="#F5C518"><rect x="124" y="28" width="8" height="16" rx="2"/></g>
    <g transform="rotate(-52 128 122)" fill="#F07818"><rect x="124" y="20" width="8" height="26" rx="2"/></g>
    <g transform="rotate(-30 128 122)" fill="#F5C518"><rect x="124" y="16" width="8" height="32" rx="2"/></g>
    <g transform="rotate(-8 128 122)" fill="#F5C518"><rect x="124" y="22" width="8" height="22" rx="2"/></g>
    <g transform="rotate(14 128 122)" fill="#F07818"><rect x="124" y="14" width="8" height="34" rx="2"/></g>
    <g transform="rotate(36 128 122)" fill="#F5C518"><rect x="124" y="20" width="8" height="24" rx="2"/></g>
    <g transform="rotate(56 128 122)" fill="#F5C518"><rect x="124" y="26" width="8" height="18" rx="2"/></g>
    <g transform="rotate(76 128 122)" fill="#F07818"><rect x="124" y="18" width="8" height="28" rx="2"/></g>
  </g>
  <g id="vinyl">
    <circle cx="128" cy="122" r="72" fill="#0E3D28"/>
    <circle cx="128" cy="122" r="58" fill="none" stroke="#145232" stroke-width="2"/>
    <circle cx="128" cy="122" r="44" fill="none" stroke="#145232" stroke-width="2"/>
    <circle cx="128" cy="122" r="30" fill="none" stroke="#145232" stroke-width="1.5"/>
    <circle cx="128" cy="122" r="22" fill="#F5C518"/>
    <circle cx="128" cy="122" r="4" fill="#0E3D28"/>
  </g>
  <polyline id="heartbeat" points="64,158 98,158 108,142 118,174 128,158 192,158" fill="none" stroke="#F07818" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="tonearm" fill="#F5C518" stroke="#F5C518" stroke-linecap="round">
    <line x1="198" y1="46" x2="150" y2="102" stroke-width="6"/>
    <circle cx="198" cy="46" r="7"/>
    <rect x="142" y="98" width="18" height="8" rx="2" transform="rotate(-50 150 102)"/>
  </g>
  <g id="crossfader">
    <rect x="46" y="216" width="164" height="16" rx="8" fill="#145232"/>
    <rect x="116" y="208" width="24" height="32" rx="5" fill="#F07818"/>
  </g>
</svg>
